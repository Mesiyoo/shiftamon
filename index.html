<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172554">
<title></title>
<style>
:root{color-scheme:light dark;--bg:#f3f5fb;--panel:#fff;--ink:#172033;--muted:#64748b;--line:#e2e8f0;--brand:#4f46e5;--brand2:#3730a3;--soft:#eef2ff;--danger:#dc2626;--danger-soft:#fee2e2}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--panel:#131d2e;--ink:#e5edf9;--muted:#9aa9bf;--line:#29364a;--brand:#818cf8;--brand2:#6366f1;--soft:#202744;--danger:#f87171;--danger-soft:#3b1d1d}}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{background:linear-gradient(125deg,#172554,#4338ca);color:white;padding:10px max(14px,calc((100vw - 800px)/2));padding-top:calc(10px + env(safe-area-inset-top));display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px #0002}
.header-title{display:flex;align-items:center;gap:12px;min-width:0}
header h1{margin:0;font-size:17px;font-weight:700;white-space:nowrap}
.header-title .reminder-label{font-size:12px;color:#dbeafe;font-weight:500;opacity:.9;white-space:nowrap}
.header-actions{display:flex;gap:6px}
.icon-btn{background:#ffffff1f;color:white;border:0;border-radius:10px;width:36px;height:36px;display:grid;place-items:center;font-size:17px;cursor:pointer;padding:0}
.icon-btn:active{transform:scale(.94)}
.search-wrap{max-height:0;overflow:hidden;transition:max-height .25s ease;padding:0 max(14px,calc((100vw - 800px)/2));background:var(--bg)}
.search-wrap.open{max-height:60px;padding-top:6px;padding-bottom:6px}
.search-wrap input{width:100%;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:none;font-size:13px}
.search-wrap input:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
main{flex:1;width:100%;max-width:800px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.notes{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:8px;-webkit-overflow-scrolling:touch}
.bubble{max-width:85%;border-radius:16px 16px 4px 16px;padding:10px 13px;align-self:flex-start;box-shadow:0 1px 3px #0f172a18;position:relative;animation:pop .18s ease;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:pan-y;transition:transform .25s,box-shadow .25s}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
.bubble.completed{opacity:.5}
.bubble.completed .bubble-text{text-decoration:line-through}
.bubble.holding{transform:scale(.96);box-shadow:0 0 0 2px var(--brand) inset,0 4px 14px #4f46e544}
.bubble-text{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;line-height:1.75;color:#172033}
@media(prefers-color-scheme:dark){.bubble-text{color:#0b1220}}
.bubble-meta{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px;font-size:10px;color:#00000070}
.bubble-actions{display:flex;gap:2px}
.mini{padding:3px 6px;font-size:11px;border-radius:6px;border:0;cursor:pointer;font-weight:600;background:transparent;color:#00000080}
.mini:hover{background:#00000015}
.mini.danger{color:#b91c1c}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px;color:var(--muted)}
.empty .emoji{font-size:48px;margin-bottom:10px}
.composer{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid var(--line);display:flex;gap:8px;align-items:flex-end;max-width:800px;width:100%;margin:0 auto;position:sticky;bottom:0}
.composer textarea{flex:1;resize:none;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:11px 14px;outline:none;max-height:140px;min-height:44px;line-height:1.6}
.composer textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
.send{background:var(--brand);color:white;border:0;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-size:20px;cursor:pointer;flex-shrink:0}
.send:active{transform:scale(.95)}

/* === مودال عمومی (تنظیمات + تایید) === */
.modal-backdrop{position:fixed;inset:0;background:#00000066;display:none;align-items:center;justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(3px)}
.modal-backdrop.open{display:flex}
.modal{background:var(--panel);border-radius:20px;width:100%;max-width:420px;padding:20px;box-shadow:0 20px 60px #0004;max-height:90vh;overflow-y:auto;animation:modalIn .2s ease}
@keyframes modalIn{from{transform:scale(.95);opacity:0}to{transform:scale(1);opacity:1}}
.modal h2{margin:0 0 8px;font-size:17px}
.modal p.msg{margin:0 0 16px;font-size:14px;color:var(--muted);line-height:1.7}
.modal .row{display:flex;flex-direction:column;gap:10px}
.modal button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 15px;font-weight:650;text-align:right;display:flex;align-items:center;gap:10px;transition:transform .12s}
.modal button:active{transform:scale(.97)}
.modal .ghost{background:var(--soft);color:var(--brand2)}
.modal .close{margin-top:14px;width:100%;justify-content:center;background:transparent;color:var(--muted);border:1px solid var(--line)}
.modal .confirm-actions{display:flex;gap:10px;margin-top:6px}
.modal .confirm-actions button{flex:1;justify-content:center}
.modal .btn-yes{background:var(--danger);color:#fff}
.modal .btn-no{background:var(--soft);color:var(--brand2)}
.hint{font-size:11px;color:var(--muted);line-height:1.7;margin-top:10px;text-align:center}
.toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#172554;color:white;padding:11px 16px;border-radius:12px;box-shadow:0 8px 28px #0003;display:none;z-index:30;max-width:90vw;text-align:center;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="header-title">
    <h1ی</h1>
    <span class="reminder-label">یادآوری</span>
  </div>
  <div class="header-actions">
    <button class="icon-btn" id="searchBtn" aria-label="جستجو">🔍</button>
    <button class="icon-btn" id="settingsBtn" aria-label="تنظیمات">⚙️</button>
  </div>
</header>

<div class="search-wrap" id="searchWrap">
  <input id="search" placeholder="جستجو در یادداشت‌ها…" aria-label="جستجو">
</div>

<main>
  <div class="notes" id="notes"></div>
</main>

<div class="composer">
  <textarea id="body" rows="1" placeholder="یادداشتت رو بنویس… (Enter برای ارسال)"></textarea>
  <button class="send" id="sendBtn" aria-label="ذخیره">➤</button>
</div>

<!-- تنظیمات -->
<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <h2>⚙️ تنظیمات</h2>
    <div class="row">
      <button class="ghost" id="exportBtn">⬇️ خروجی پشتیبان</button>
      <button class="ghost" id="importBtn">⬆️ بازیابی پشتیبان</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <p class="hint">یادداشت‌ها فقط روی همین مرورگر ذخیره می‌شوند.</p>
    <button class="close" id="closeSettings">بستن</button>
  </div>
</div>

<!-- تایید حذف -->
<div class="modal-backdrop" id="confirmModal">
  <div class="modal">
    <h2>حذف یادداشت</h2>
    <p class="msg">مطمئنی؟</p>
    <div class="confirm-actions">
      <button class="btn-yes" id="confirmYes">آره</button>
      <button class="btn-no" id="confirmNo">نه</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const $=id=>document.getElementById(id);
const KEY='yaddashtyar_notes_v1';
const COLORS=['#fff4c2','#d9fbe7','#dbeafe','#fce7f3','#ede9fe','#ffe4d6','#e0f2fe','#fef9c3'];
let notes=[];
try{notes=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(notes))notes=[];}catch(e){notes=[];}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(notes));}catch(e){toast('فضای ذخیره پر شده است.');}}
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',2200);}
function safe(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function dateText(ts){try{return new Date(ts).toLocaleDateString('fa-IR',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}

// === مودال تایید با Promise ===
function askConfirm(message){
  return new Promise(resolve=>{
    $('confirmModal').querySelector('.msg').textContent=message||'مطمئنی؟';
    const modal=$('confirmModal');
    modal.classList.add('open');
    const yes=$('confirmYes'),no=$('confirmNo');
    function cleanup(result){
      modal.classList.remove('open');
      yes.removeEventListener('click',onYes);
      no.removeEventListener('click',onNo);
      modal.removeEventListener('click',onBackdrop);
      resolve(result);
    }
    function onYes(){cleanup(true);}
    function onNo(){cleanup(false);}
    function onBackdrop(e){if(e.target===modal)cleanup(false);}
    yes.addEventListener('click',onYes);
    no.addEventListener('click',onNo);
    modal.addEventListener('click',onBackdrop);
  });
}

function render(){
  const q=$('search').value.trim().toLocaleLowerCase('fa');
  let list=notes.filter(n=>!q||(n.body||'').toLocaleLowerCase('fa').includes(q));
  list.sort((a,b)=>(a.updated||0)-(b.updated||0));
  if(!list.length){
    $('notes').innerHTML='<div class="empty"><div class="emoji">'+(q?'🔎':'💬')+'</div><strong>'+(q?'چیزی پیدا نشد':'هنوز یادداشتی نداری')+'</strong><div style="margin-top:6px;font-size:13px">'+(q?'عبارت دیگری را جستجو کن.':'از کادر پایین شروع کن.')+'</div></div>';
    return;
  }
  $('notes').innerHTML=list.map((n,i)=>{
    const bg=n.color||COLORS[i%COLORS.length];
    return '<div class="bubble '+(n.completed?'completed':'')+'" data-id="'+safe(n.id)+'" style="background:'+bg+'"><div class="bubble-text">'+safe(n.body||'')+'</div><div class="bubble-meta"><span>'+dateText(n.updated||n.created)+'</span><div class="bubble-actions"><button class="mini" data-action="edit" data-id="'+safe(n.id)+'">✏️</button><button class="mini danger" data-action="delete" data-id="'+safe(n.id)+'">🗑️</button></div></div></div>';
  }).join('');
  scrollToBottom();
}
function scrollToBottom(){const box=$('notes');requestAnimationFrame(()=>{box.scrollTop=box.scrollHeight;});}

function addNote(){
  const body=$('body').value.trim();
  if(!body)return;
  const now=Date.now();
  notes.unshift({id:String(now)+'_'+Math.random().toString(36).slice(2,8),body,color:COLORS[Math.floor(Math.random()*COLORS.length)],completed:false,created:now,updated:now});
  persist();render();
  $('body').value='';autoResize();
  $('body').focus();
}
function autoResize(){const t=$('body');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px';}

$('sendBtn').addEventListener('click',addNote);
$('body').addEventListener('input',autoResize);
$('body').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();addNote();}});
$('search').addEventListener('input',render);

$('searchBtn').addEventListener('click',()=>{
  const w=$('searchWrap');
  w.classList.toggle('open');
  if(w.classList.contains('open'))setTimeout(()=>$('search').focus(),150);
  else{$('search').value='';render();}
});

let holdTimer=null,holdEl=null,longPressed=false;
function startHold(el){
  holdEl=el;longPressed=false;
  el.classList.add('holding');
  holdTimer=setTimeout(()=>{
    longPressed=true;
    const n=notes.find(x=>x.id===el.dataset.id);
    if(n){n.completed=!n.completed;n.updated=Date.now();persist();render();toast(n.completed?'✓ انجام شد':'↩️ فعال شد');}
    if(navigator.vibrate)navigator.vibrate(40);
  },2000);
}
function cancelHold(){
  clearTimeout(holdTimer);holdTimer=null;
  if(holdEl)holdEl.classList.remove('holding');
  holdEl=null;
}
$('notes').addEventListener('touchstart',e=>{
  const el=e.target.closest('.bubble');
  if(el&&!e.target.closest('[data-action]'))startHold(el);
},{passive:true});
$('notes').addEventListener('touchend',cancelHold,{passive:true});
$('notes').addEventListener('touchmove',cancelHold,{passive:true});
$('notes').addEventListener('touchcancel',cancelHold,{passive:true});
$('notes').addEventListener('mousedown',e=>{
  const el=e.target.closest('.bubble');
  if(el&&!e.target.closest('[data-action]'))startHold(el);
});
$('notes').addEventListener('mouseup',cancelHold);
$('notes').addEventListener('mouseleave',cancelHold);

$('notes').addEventListener('click',async e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  e.stopPropagation();
  if(longPressed){longPressed=false;return;}
  const n=notes.find(x=>x.id===b.dataset.id);if(!n)return;
  if(b.dataset.action==='edit'){
    $('body').value=n.body;$('body').focus();autoResize();
    notes=notes.filter(x=>x.id!==n.id);persist();render();
    toast('متن را ویرایش و ارسال کن.');
  }else if(b.dataset.action==='delete'){
    const ok=await askConfirm('مطمئنی؟');
    if(ok){
      notes=notes.filter(x=>x.id!==n.id);
      persist();render();toast('حذف شد.');
    }
  }
});

$('settingsBtn').addEventListener('click',()=>$('settingsModal').classList.add('open'));
$('closeSettings').addEventListener('click',()=>$('settingsModal').classList.remove('open'));
$('settingsModal').addEventListener('click',e=>{if(e.target.id==='settingsModal')$('settingsModal').classList.remove('open');});
$('exportBtn').addEventListener('click',()=>{
  const blob=new Blob([JSON.stringify({app:'یادداشت‌یار',version:2,exportedAt:new Date().toISOString(),notes},null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='yaddashtyar-backup-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast('فایل پشتیبان آماده شد.');
});
$('importBtn').addEventListener('click',()=>$('importFile').click());
$('importFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{
    const data=JSON.parse(await f.text()),incoming=Array.isArray(data)?data:data.notes;
    if(!Array.isArray(incoming))throw Error();
    if(!confirm('یادداشت‌های این فایل اضافه شوند؟'))return;
    const existing=new Set(notes.map(n=>n.id));
    incoming.forEach((n,i)=>{
      if(n&&typeof n==='object'){
        notes.push({id:existing.has(String(n.id))?String(Date.now())+'_'+i:String(n.id||Date.now()+'_'+i),body:String(n.body||n.title||''),color:n.color||COLORS[i%COLORS.length],completed:!!n.completed,created:Number(n.created)||Date.now(),updated:Number(n.updated)||Date.now()});
      }
    });
    persist();render();toast('پشتیبان بازیابی شد.');
  }catch(err){toast('فایل معتبر نیست.');}
  finally{e.target.value='';}
});

render();
setTimeout(scrollToBottom,50);
})();
</script>
</body>
</html>
